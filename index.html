<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Pong — Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: #eef6ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 35%, #122744 0, #07111f 65%);
    }
    main { width: min(900px, 100%); text-align: center; }
    h1 { margin: 0 0 6px; font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: .16em; }
    .subtitle { margin: 0 0 22px; color: #a9bdd4; }
    .scoreboard {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(32px, 12vw, 110px);
      margin: 0 0 14px;
      font-variant-numeric: tabular-nums;
    }
    .score-label { color: #a9bdd4; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
    .score { font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1.1; font-weight: 750; }
    .game-wrap {
      overflow: hidden;
      border: 1px solid #34516e;
      border-radius: 12px;
      box-shadow: 0 18px 60px #0008;
      background: #081522;
    }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 5 / 3; touch-action: none; cursor: crosshair; }
    .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 18px 0 12px; }
    button {
      min-width: 112px;
      padding: 10px 18px;
      border: 1px solid #4a6783;
      border-radius: 999px;
      background: #152b42;
      color: inherit;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button:hover { background: #203d59; }
    button:focus-visible { outline: 3px solid #69e5dc; outline-offset: 3px; }
    .help { margin: 0; color: #a9bdd4; font-size: .9rem; line-height: 1.7; }
    kbd { padding: 2px 6px; border: 1px solid #45617b; border-radius: 4px; background: #122439; color: #eef6ff; }
    @media (max-width: 520px) { body { padding: 16px; } .subtitle { margin-bottom: 16px; } }
  </style>
</head>
<body>
  <main>
    <h1>PONG</h1>
    <p class="subtitle">First to 7 points wins</p>
    <section class="scoreboard" aria-label="Scoreboard">
      <div><div class="score-label">You</div><div class="score" id="player-score" aria-live="polite">0</div></div>
      <div><div class="score-label">Computer</div><div class="score" id="computer-score" aria-live="polite">0</div></div>
    </section>
    <div class="game-wrap">
      <canvas id="game" width="900" height="540" aria-label="Pong game. Move your paddle with the mouse or up and down arrow keys."></canvas>
    </div>
    <div class="controls">
      <button id="start-button" type="button">Start game</button>
      <button id="pause-button" type="button" disabled>Pause</button>
      <button id="reset-button" type="button">Reset</button>
    </div>
    <p class="help">Move your mouse over the court or use <kbd>↑</kbd> <kbd>↓</kbd> to control your paddle. <kbd>Space</kbd> starts or pauses.</p>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const playerScoreEl = document.getElementById('player-score');
      const computerScoreEl = document.getElementById('computer-score');
      const startButton = document.getElementById('start-button');
      const pauseButton = document.getElementById('pause-button');
      const resetButton = document.getElementById('reset-button');
      const W = canvas.width;
      const H = canvas.height;
      const paddle = { width: 14, height: 104, inset: 34, speed: 520 };
      const ballRadius = 9;
      const keys = new Set();
      let playerY = (H - paddle.height) / 2;
      let computerY = playerY;
      let playerScore = 0;
      let computerScore = 0;
      let ballX = W / 2;
      let ballY = H / 2;
      let ballVX = 0;
      let ballVY = 0;
      let running = false;
      let finished = false;
      let lastTime = 0;
      let animationFrame;

      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

      function resetBall(direction = Math.random() < 0.5 ? -1 : 1) {
        ballX = W / 2;
        ballY = H / 2;
        const angle = (Math.random() * 0.8 - 0.4) * Math.PI / 4;
        const speed = 390;
        ballVX = Math.cos(angle) * speed * direction;
        ballVY = Math.sin(angle) * speed;
      }

      function updateScore() {
        playerScoreEl.textContent = playerScore;
        computerScoreEl.textContent = computerScore;
      }

      function begin() {
        if (finished) resetGame();
        if (!running) {
          if (ballVX === 0 && ballVY === 0) resetBall();
          running = true;
          lastTime = 0;
          startButton.textContent = 'Playing';
          pauseButton.disabled = false;
          pauseButton.textContent = 'Pause';
        }
      }

      function togglePause() {
        if (finished) return;
        if (running) {
          running = false;
          startButton.textContent = 'Resume';
          pauseButton.textContent = 'Resume';
        } else {
          begin();
        }
      }

      function resetGame() {
        running = false;
        finished = false;
        playerScore = 0;
        computerScore = 0;
        playerY = computerY = (H - paddle.height) / 2;
        ballVX = ballVY = 0;
        ballX = W / 2;
        ballY = H / 2;
        updateScore();
        startButton.textContent = 'Start game';
        pauseButton.textContent = 'Pause';
        pauseButton.disabled = true;
        draw();
      }

      function finishRound(winner) {
        running = false;
        finished = true;
        startButton.textContent = 'Play again';
        pauseButton.disabled = true;
        pauseButton.textContent = 'Pause';
        draw(winner);
      }

      function scorePoint(playerWon) {
        if (playerWon) playerScore++;
        else computerScore++;
        updateScore();
        if (playerScore >= 7) return finishRound('You win!');
        if (computerScore >= 7) return finishRound('Computer wins!');
        resetBall(playerWon ? 1 : -1);
      }

      function update(dt) {
        if (keys.has('ArrowUp')) playerY -= paddle.speed * dt;
        if (keys.has('ArrowDown')) playerY += paddle.speed * dt;
        playerY = clamp(playerY, 0, H - paddle.height);

        // The computer tracks the ball with a small delay to keep the rally playable.
        const computerCenter = computerY + paddle.height / 2;
        const target = ballY - paddle.height / 2;
        const aiSpeed = 350;
        computerY += clamp(target - computerY, -aiSpeed * dt, aiSpeed * dt);
        computerY = clamp(computerY, 0, H - paddle.height);

        ballX += ballVX * dt;
        ballY += ballVY * dt;

        if (ballY - ballRadius <= 0) {
          ballY = ballRadius;
          ballVY = Math.abs(ballVY);
        } else if (ballY + ballRadius >= H) {
          ballY = H - ballRadius;
          ballVY = -Math.abs(ballVY);
        }

        const playerX = paddle.inset;
        const computerX = W - paddle.inset - paddle.width;
        if (ballVX < 0 && ballX - ballRadius <= playerX + paddle.width && ballX + ballRadius >= playerX && ballY + ballRadius >= playerY && ballY - ballRadius <= playerY + paddle.height) {
          ballX = playerX + paddle.width + ballRadius;
          const offset = (ballY - (playerY + paddle.height / 2)) / (paddle.height / 2);
          ballVX = Math.min(Math.abs(ballVX) * 1.06, 720);
          ballVY = offset * 420;
        } else if (ballVX > 0 && ballX + ballRadius >= computerX && ballX - ballRadius <= computerX + paddle.width && ballY + ballRadius >= computerY && ballY - ballRadius <= computerY + paddle.height) {
          ballX = computerX - ballRadius;
          const offset = (ballY - (computerY + paddle.height / 2)) / (paddle.height / 2);
          ballVX = -Math.min(Math.abs(ballVX) * 1.06, 720);
          ballVY = offset * 420;
        }

        if (ballX + ballRadius < 0) scorePoint(false);
        else if (ballX - ballRadius > W) scorePoint(true);
      }

      function draw(message = '') {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#081522';
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = '#36516a';
        ctx.lineWidth = 3;
        ctx.setLineDash([12, 14]);
        ctx.beginPath();
        ctx.moveTo(W / 2, 0);
        ctx.lineTo(W / 2, H);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#69e5dc';
        ctx.fillRect(paddle.inset, playerY, paddle.width, paddle.height);
        ctx.fillStyle = '#ffbd69';
        ctx.fillRect(W - paddle.inset - paddle.width, computerY, paddle.width, paddle.height);

        ctx.beginPath();
        ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#f3f7ff';
        ctx.shadowColor = '#f3f7ff';
        ctx.shadowBlur = 16;
        ctx.fill();
        ctx.shadowBlur = 0;

        if (!running) {
          ctx.fillStyle = '#d9e7f5';
          ctx.textAlign = 'center';
          ctx.font = '600 26px system-ui, sans-serif';
          ctx.fillText(message || (finished ? '' : 'Press Start to play'), W / 2, H / 2 + 88);
        }
      }

      function frame(time) {
        if (running) {
          const dt = lastTime ? Math.min((time - lastTime) / 1000, 0.04) : 0;
          lastTime = time;
          update(dt);
        }
        draw(finished ? (playerScore >= 7 ? 'You win!' : 'Computer wins!') : '');
        animationFrame = requestAnimationFrame(frame);
      }

      function movePlayerToPointer(event) {
        const rect = canvas.getBoundingClientRect();
        const y = (event.clientY - rect.top) * (H / rect.height);
        playerY = clamp(y - paddle.height / 2, 0, H - paddle.height);
        if (!running) draw();
      }

      canvas.addEventListener('pointermove', movePlayerToPointer);
      window.addEventListener('keydown', (event) => {
        if (['ArrowUp', 'ArrowDown', ' '].includes(event.key)) event.preventDefault();
        if (event.key === 'ArrowUp' || event.key === 'ArrowDown') keys.add(event.key);
        if (event.code === 'Space' && !event.repeat) togglePause();
      });
      window.addEventListener('keyup', (event) => keys.delete(event.key));
      window.addEventListener('blur', () => keys.clear());
      startButton.addEventListener('click', begin);
      pauseButton.addEventListener('click', togglePause);
      resetButton.addEventListener('click', resetGame);

      resetGame();
      cancelAnimationFrame(animationFrame);
      animationFrame = requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
